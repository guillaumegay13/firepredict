name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      # The leakage tests need the school-holiday calendar (a small CSV).
      - run: uv run python -m firepredict.download calendar
      - run: uv run pytest -q
