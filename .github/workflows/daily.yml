name: daily forecast

# Every morning: refresh the weather, archive the frozen model's forecast in
# forecasts/, rebuild the risk map and publish it on GitHub Pages.
on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC, after Météo-France's morning update
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Fixed tables (see static/README.md)
        run: mkdir -p data/processed && cp static/*.parquet data/processed/
      - name: Download fire records, weather, calendar, commune boundaries
        run: uv run python -m firepredict.download bdiff meteo calendar communes
      - run: uv run python -m firepredict.dataset
      - run: uv run python -m firepredict.features
      - run: uv run python -m firepredict.forecast
      - run: uv run python -m firepredict.risk_map
      - name: Commit the archived forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          git diff --cached --quiet || git commit -m "Forecast archive: $(ls forecasts | tail -1 | sed 's/.csv//')"
          git push
      - name: Prepare the site
        run: mkdir -p site && cp results/risk_map.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
