name: daily forecast

# Every morning, for each department: refresh the weather, archive the frozen
# models' forecasts in forecasts/, rebuild the risk maps and publish them on
# GitHub Pages (the Var at the site root, other departments in /<code>/).
on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC, after Météo-France's morning update
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Data for each department (fixed tables, fire records, weather, calendar, communes)
        run: |
          for code in 83 13; do
            mkdir -p data/processed/$code && cp static/$code/*.parquet data/processed/$code/
            export FIREPREDICT_DEPARTMENT=$code
            uv run python -m firepredict.download bdiff meteo calendar communes
            uv run python -m firepredict.dataset
            uv run python -m firepredict.features
          done
      - name: Var forecast, model v2 (the original live test)
        run: uv run python -m firepredict.forecast
      - name: Forecasts for every department, model v3
        run: uv run python -m firepredict.model_v3 forecast
      - name: Maps
        run: |
          for code in 83 13; do FIREPREDICT_DEPARTMENT=$code uv run python -m firepredict.risk_map; done
      - name: Commit the archived forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          git diff --cached --quiet || git commit -m "Forecast archive: $(date -u +%Y-%m-%d)"
          git push
      - name: Prepare the site
        run: |
          mkdir -p site/13
          cp results/83/risk_map.html site/index.html
          cp results/13/risk_map.html site/13/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
